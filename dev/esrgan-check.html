<!doctype html>
<html><head><meta charset="utf-8"><title>esrgan check</title></head>
<body><pre id="out">running</pre>
<script type="module">
import { PipelineClient } from '../src/lib/workerClient.ts'
import { DEFAULT_SETTINGS } from '../src/lib/settings.ts'
const out = document.getElementById('out')
const log = (s) => { out.textContent += '\n' + s; console.log(s) }
async function load(url) {
  const img = new Image(); img.src = url; await img.decode()
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0)
  const d = ctx.getImageData(0, 0, img.width, img.height)
  return { width: d.width, height: d.height, data: d.data }
}
try {
  log('isolated=' + crossOriginIsolated + ' gpu=' + ('gpu' in navigator))
  const client = new PipelineClient()
  const src = await load('/samples/logo-600.jpg')
  client.setSource(src)
  let t = performance.now()
  const backend = await client.warmModel()
  log('model ready on ' + backend + ' in ' + Math.round(performance.now() - t) + ' ms')
  for (const w of [2, 4]) {
    t = performance.now()
    const r = await client.run('export', { settings: { ...DEFAULT_SETTINGS, removeBackground: true }, garmentHex: '#141414', printWidthIn: w, upscale: 'ai' }, (s, f) => {})
    log(`export ${w}in: ${r.image.width}x${r.image.height} via ${r.upscaledWith} factor ${r.report.upscaleFactor.toFixed(2)} semi=${r.report.semiTransparentAfter} png=${r.png.length}B in ${Math.round(performance.now() - t)} ms`)
  }
  log('DONE')
} catch (e) { log('ERROR ' + e.message + '\n' + e.stack) }
</script></body></html>
